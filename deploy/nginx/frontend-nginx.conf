server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Dev convenience: proxy API to the backend container (in prod the outer
  # nginx handles /api before requests ever reach this server).
  # DNS is resolved lazily per-request (docker resolver) — a static proxy_pass
  # hostname would make nginx CRASH at startup if the backend container isn't
  # up yet, taking the whole frontend down.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream backend:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
