# exprontopay.pro — static landing page (leads to the Telegram bot).
# HTTP block also serves ACME challenges for certificate issuance.
server {
  listen 80;
  server_name exprontopay.pro www.exprontopay.pro;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://exprontopay.pro$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name exprontopay.pro www.exprontopay.pro;

  ssl_certificate /etc/letsencrypt/live/exprontopay.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/exprontopay.pro/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /var/www/landing;
  index index.html;

  # index.html always fresh (deploys pick up immediately); assets cached
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
