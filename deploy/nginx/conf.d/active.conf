server {
  listen 80;
  server_name prontopay.pro www.prontopay.pro;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name prontopay.pro www.prontopay.pro;

  ssl_certificate /etc/letsencrypt/live/prontopay.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prontopay.pro/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/prontopay.pro/chain.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Container IPs change on every `compose up --build`; a static proxy_pass
  # resolves them ONCE at nginx startup and then 502s until nginx restarts.
  # Docker's embedded DNS + variable upstreams force per-request re-resolution.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:80;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
